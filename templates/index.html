<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🫣 Sentix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-4">
    <h1 class="brand">
    <span class="wave">👋</span>
    Hi, I'm <span class="sentix-name">Sentix</span>
    </h1>

    <h2 class="text-center">
         Your Product Sentiment Buddy 😉
    </h2>
    <hr class="my-4">
    <p class="text-center subtitle">
        😄Tell me what you think, I'll read between the lines 
    </p>



    <div class="row mt-4">
        {% for key, product in products.items() %}
        <div class="col-md-4">
            <div class="card product-card">
                <img src="{{ url_for('static', filename='products/' + product.image) }}" 
                      class="card-img-top product-img">


                <div class="card-body">
                    <h4 class="card-title">{{ product.name }}</h4>

                    <p class="sentiment">
                        <span class="emoji positive"></span> {{ product.positive }}
                        |
                        <span class="emoji negative"></span> {{ product.negative }}
                    </p>

                    <form method="post" action="/review/{{ key }}">
                        <textarea name="text" placeholder="Type your review here 💬" required></textarea>
                        <button class="btn btn-fun mt-2">Analyze 🚀😲</button>
                    </form>

                    <div class="reviews">
                        {% for review in product.reviews %}
                        <div class="review">
                            <span class="emoji {{ review.sentiment }}"></span>
                            {{ review.text }}
                        </div>
                        {% endfor %}
                    </div>

                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
